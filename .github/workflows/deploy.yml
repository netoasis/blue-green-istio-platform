name: Blue Green Deployment

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: docker-registry.sandstone.com.au
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: false
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-green:
    needs: build
    name: Deploy Green
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Green Version
        run: |
          set -e

          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 5m \
            --set green.image.tag=${{ github.sha }} \
            --set deployment.green.replicas=4 \
            --set virtualService.weights.blue=100 \
            --set virtualService.weights.green=0

      - name: Wait for Green Deployment
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }}-green \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verify Kubernetes Resources
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          kubectl get svc -n ${{ env.NAMESPACE }}
          kubectl get virtualservice -n ${{ env.NAMESPACE }}
          kubectl get destinationrule -n ${{ env.NAMESPACE }}

      - name: Progressive Traffic Shift
        run: |
          set -e

          stages=(
            "75:25"
            "50:50"
            "25:75"
            "0:100"
          )

          for stage in "${stages[@]}"; do

            IFS=':' read -r blue_weight green_weight <<< "$stage"

            echo "======================================="
            echo "Shifting Traffic"
            echo "Blue  = ${blue_weight}%"
            echo "Green = ${green_weight}%"
            echo "======================================="

            helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
              --namespace ${{ env.NAMESPACE }} \
              --atomic \
              --wait \
              --timeout 5m \
              --set virtualService.weights.blue=${blue_weight} \
              --set virtualService.weights.green=${green_weight}

            echo "Waiting for stabilization..."
            sleep 20

            kubectl rollout status deployment/${{ env.APP_NAME }}-green \
              -n ${{ env.NAMESPACE }} \
              --timeout=120s

            kubectl get pods -n ${{ env.NAMESPACE }}

          done

      - name: Finalize Green Deployment
        run: |
          set -e

          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --atomic \
            --wait \
            --timeout 5m \
            --set deployment.blue.replicas=0 \
            --set deployment.green.replicas=4 \
            --set virtualService.weights.blue=0 \
            --set virtualService.weights.green=100

      - name: Final Validation
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}
          kubectl get virtualservice -n ${{ env.NAMESPACE }}

          kubectl rollout status deployment/${{ env.APP_NAME }}-green \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."

          helm rollback ${{ env.HELM_RELEASE_NAME }} \
            --namespace ${{ env.NAMESPACE }}

          kubectl rollout status deployment/${{ env.APP_NAME }}-blue \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

          kubectl get pods -n ${{ env.NAMESPACE }}

  deploy-blue:
    needs: deploy-green
    name: Deploy Blue
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Blue Image Tag
        run: |
          set -e

          find "$PR_DIR" -type f -name "values.yaml" \
            -exec sed -i "/^blue:$/,/^[^ ]/ s/^\( *tag: \).*/\1${{ github.sha }}/" {} \;

      - name: Deploy Updated Blue
        run: |
          set -e

          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --atomic \
            --wait

          kubectl rollout status deployment/${{ env.APP_NAME }}-blue \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Shift Traffic to Blue and Stop Green
        run: |
          set -e

          stages=(
            "25:75"
            "50:50"
            "75:25"
            "100:0"
          )

          for stage in "${stages[@]}"; do

            IFS=':' read -r blue_weight green_weight <<< "$stage"

            echo "Blue=${blue_weight} Green=${green_weight}"

            helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
              --namespace ${{ env.NAMESPACE }} \
              --set virtualService.weights.blue=${blue_weight} \
              --set virtualService.weights.green=${green_weight}

            sleep 20

            kubectl rollout status deployment/${{ env.APP_NAME }}-blue \
              -n ${{ env.NAMESPACE }} \
              --timeout=120s

          done

      - name: Scale Down Green
        run: |
          set -e

          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --set deployment.green.replicas=0 \
            --set virtualService.weights.blue=100 \
            --set virtualService.weights.green=0

      - name: Commit updated values
        run: |
          set -e

          git config --global user.email "sam.shan@yahoo.com"
          git config --global user.name "netoasis"

          git add .

          git diff --cached --quiet || \
          git commit -m "Update blue image to ${{ github.sha }}"

          git push origin HEAD:${GITHUB_REF_NAME}