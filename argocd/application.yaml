apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fakehost
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/netoasis/blue-green-istio-platform.git
    targetRevision: main
    path: charts/helm-staging

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true