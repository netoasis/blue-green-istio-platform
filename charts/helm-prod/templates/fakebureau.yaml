apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakebureau
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fakebureau
  template:
    metadata:
      labels:
        app: fakebureau
    spec:
      containers:
      - image: docker-registry.sandstone.com.au/docker/hsbc_fakebureau
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        name: fakebureau
      restartPolicy: Always
      imagePullSecrets:
        - name: sst-docker-registry-key
---
apiVersion: v1
kind: Service
metadata:
  name: fakebureau
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ports:
  - port: 7362
  selector:
    app: fakebureau
