apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdsproxy
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.rdsproxy.replicas }}
  selector:
    matchLabels:
      app: rdsproxy
  template:
    metadata:
      labels:
        app: rdsproxy
    spec:
      containers:
      - image: docker-registry.sandstone.com.au/docker/sst_rdsproxy:0.1.476
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        name: rdsproxy
        resources:
          limits:
            memory: "256Mi"
          requests:
            memory: "128Mi"
        env:
        - name: RDS_HOST
          value: {{ .Values.global.deploy.dbhost }}
      restartPolicy: Always
      imagePullSecrets:
        - name: sst-docker-registry-key
---
apiVersion: v1
kind: Service
metadata:
  name: rdsproxy
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ports:
  - port: 80
  selector:
    app: rdsproxy
