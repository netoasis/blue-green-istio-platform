# -----------------------------
# BLUE DEPLOYMENT
# -----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.global.appName }}-blue"
  namespace: "{{ .Values.global.namespace }}"
spec:
  replicas: {{ .Values.deployment.blue.replicas }}
  selector:
    matchLabels:
      app: "{{ .Values.global.appName }}"
      version: blue
  template:
    metadata:
      labels:
        app: "{{ .Values.global.appName }}"
        version: blue
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: "{{ .Values.global.appName }}"
          image: "{{ .Values.blue.image.repository }}:{{ .Values.blue.image.tag }}"
          args:
            - "-text=BLUE"
            - "-listen=0.0.0.0:5678"
          imagePullPolicy: Always
          ports:
          - containerPort: 5678
            name: http
            protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.deployment.resources.requests.cpu }}
              memory: {{ .Values.deployment.resources.requests.memory }}
            limits:
              cpu: {{ .Values.deployment.resources.limits.cpu }}
              memory: {{ .Values.deployment.resources.limits.memory }}
          startupProbe:
            tcpSocket:
              port: 5678
            # fakehost has 60 seconds to start
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 5678
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 5678
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10

---

