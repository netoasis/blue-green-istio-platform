global:
  namespace: staging
  appName: fakehost

image:
  repository: hashicorp/http-echo
  tag: 1.0.0 #0.2.3

service:
  port: 80
  targetPort: 8080

deployment:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  blue:
    replicas: 4
  green:
    replicas: 1

virtualService:
  host: "fakehost.staging.internal"
  gateway: istio-system/ingressgateway
  timeout: 15s
  weights:
    blue: 100
    green: 0

hpa:
  blue:
    minReplicas: 4
    maxReplicas: 10
    cpuTarget: 75

  green:
    minReplicas: 1
    maxReplicas: 15
    cpuTarget: 60