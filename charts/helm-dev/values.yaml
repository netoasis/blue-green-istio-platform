global:
  namespace: dev
  appName: fakehost
  host: "fakehost.dev.internal"

image:
  repository: hashicorp/http-echo
  tag: 1.0.0 #1.0.0 #0.2.3

service:
  port: 80
  targetPort: 8080

deployment:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  blue:
    replicas: 4
  green:
    replicas: 1
