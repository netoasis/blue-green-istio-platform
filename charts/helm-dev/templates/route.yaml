apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Values.global.appName }}-route"
  namespace: "{{ .Values.global.namespace }}"
spec:
  parentRefs:
    - name: {{ .Values.global.appName }}-gateway

  hostnames:
    - {{ .Values.global.host }}

  rules:
    - backendRefs:
        - name: {{ .Values.global.appName }}-active
          port: 80
